name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'  # 00:00 UTC on January 1st

# Least privilege: the build job only reads; the deploy job adds the Pages
# write and OIDC token it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # publish the artifact to GitHub Pages
      id-token: write  # OIDC token deploy-pages uses to verify the deploy source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Runs after the deploy on purpose. Pinging during the build (the old
  # astro-indexnow integration) made the search engine fetch the key file
  # before it was published, and the key was then marked failed: every ping
  # after 2026-11-06 got 403 UserForbiddedToAccessSite. By this point the
  # site is live. The key is public by design (it proves ownership by being
  # served from the site), so it sits in plain env.
  indexnow:
    name: Ping IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      INDEXNOW_KEY: b9db15b62c683144774ab2eaaca2838c
      BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
    steps:
      - name: Wait for the key file to be live
        run: |
          # Pages' CDN can lag a few seconds behind the deploy job.
          for i in $(seq 1 10); do
            body=$(curl -fsS "https://badger.fit/${INDEXNOW_KEY}.txt" || true)
            if [ "$body" = "$INDEXNOW_KEY" ]; then
              echo "Key file live (try $i)"
              exit 0
            fi
            echo "Key file not live yet (try $i), waiting 15s"
            sleep 15
          done
          echo "::error::Key file never became live"
          exit 1

      # Checked out only to diff the pushed commits (no credentials kept).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out which pages changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : > urls.txt
          # Only a push has a before/after range. Manual and scheduled runs,
          # new branches (all-zero before) and force-pushes (before commit gone)
          # cannot say what changed, so they submit nothing.
          if [ "$EVENT_NAME" != push ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Cannot tell what changed (event $EVENT_NAME), skipping submission"
            exit 0
          fi
          # Page source -> route. Dynamic routes ([x]) and non-page files
          # (layouts, components, styles) cannot be mapped to a URL, so they are
          # left out rather than guessed at.
          git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- 'src/pages/' \
            | python3 -c '
          import re, sys
          for f in sys.stdin.read().split("\n"):
              m = re.fullmatch(r"src/pages/(.+)\.(astro|md|mdx)", f)
              if not m or "[" in f or "/_" in f or f.startswith("src/pages/_"):
                  continue
              route = m.group(1)
              route = re.sub(r"(^|/)index$", "", route)
              print("https://badger.fit/" + route + ("/" if route else ""))
          ' | sort -u > candidates.txt
          # Keep only URLs the live sitemap lists, so a wrong guess never goes out.
          index=$(curl -fsS https://badger.fit/sitemap-index.xml)
          : > sitemap.txt
          for sm in $(printf '%s' "$index" | python3 -c 'import re,sys; print("\n".join(re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", sys.stdin.read())))'); do
            curl -fsS "$sm" | python3 -c 'import re,sys; print("\n".join(re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", sys.stdin.read())))' >> sitemap.txt
          done
          grep -Fxf sitemap.txt candidates.txt > urls.txt || true
          echo "Changed pages to submit: $(wc -l < urls.txt)"
          cat urls.txt

      - name: Submit changed URLs to IndexNow
        run: |
          set -euo pipefail
          if [ ! -s urls.txt ]; then
            echo "No changed pages, nothing to submit"
            exit 0
          fi
          python3 - > payload.json <<'PY'
          import json, os
          key = os.environ["INDEXNOW_KEY"]
          urls = [u for u in open("urls.txt").read().split() if u]
          print(json.dumps({"host": "badger.fit", "key": key,
                            "keyLocation": f"https://badger.fit/{key}.txt",
                            "urlList": urls}))
          PY
          # Yandex's endpoint, not api.indexnow.org: since 2026-11-08 Bing
          # answers every IndexNow ping for badger.fit with 403
          # UserForbiddedToAccessSite although the key file is live and
          # Yandex accepts the same key. Bing gets the URLs from the next step.
          status=$(curl -sS --max-time 30 -o response.txt -w '%{http_code}' \
            -X POST https://yandex.com/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json) || status=000
          echo "HTTP $status"
          cat response.txt 2>/dev/null || true
          # 200 = accepted, 202 = accepted pending key validation. Anything
          # else is a warning, not a failure: search engines still read the
          # sitemap, and a red deploy for a best-effort ping costs more than it
          # saves (4 of 26 deploys went red on a 403 before this).
          case "$status" in 200|202) ;; *) echo "::warning::IndexNow submission returned HTTP $status" ;; esac

      - name: Submit changed URLs to Bing (Webmaster URL Submission API)
        # Skipped until the BING_WEBMASTER_KEY repo secret exists, and when no
        # page changed.
        if: env.BING_WEBMASTER_KEY != ''
        run: |
          set -euo pipefail
          if [ ! -s urls.txt ]; then
            echo "No changed pages, nothing to submit"
            exit 0
          fi
          python3 - > bing.json <<'PY'
          import json
          urls = [u for u in open("urls.txt").read().split() if u]
          print(json.dumps({"siteUrl": "https://badger.fit/", "urlList": urls}))
          PY
          status=$(curl -sS --max-time 30 -o bing.txt -w '%{http_code}' \
            -X POST "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlBatch?apikey=${BING_WEBMASTER_KEY}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @bing.json) || status=000
          echo "HTTP $status"
          cat bing.txt 2>/dev/null || true
          # The daily quota is 100 URLs; a deploy now sends only the changed pages, so
          # it is rarely reached. Bing still reads the sitemap, so a
          # refusal is a warning; the weekly search health report watches Bing.
          if [ "$status" != 200 ]; then
            echo "::warning::Bing URL submission returned HTTP $status"
          fi
