# Builds the site on pull requests, so a broken build shows on the PR and not
# after the merge that publishes it. Same steps as the build job in deploy.yml,
# minus the Pages artifact and deploy. Also runs the anchor tests. test:sheets is left out: its staleness check
# passes on the Mac but fails on ubuntu-latest (committed xlsx bytes differ), so it
# stays a manual release step until that is fixed.

name: Build check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:anchors
